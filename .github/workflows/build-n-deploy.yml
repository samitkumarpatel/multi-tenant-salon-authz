name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "helm/auth/**"
      - "pom.xml"
      - ".github/workflows/build-n-deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samitkumarpatel/multi-tenant-salon-authz
  AKS_RESOURCE_GROUP: multi-tenant-salon-dev
  AKS_CLUSTER_NAME: salon-saas-dev
  AKS_NAMESPACE: salon

jobs:
  # ── Stage 1: Build & push image ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build-image
        run: |
          IMAGE=$REGISTRY/$IMAGE_NAME

          ./mvnw -B spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$IMAGE:${{ github.sha }}

          docker push $IMAGE:${{ github.sha }}

          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

          echo "image=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ── Stage 2: Azure AKS deployment via Helm ───────────────────────────────────
  deploy-azure:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy auth via Helm
        run: |
          helm upgrade --install auth ./helm/auth \
            --namespace ${{ env.AKS_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m \
            --debug

      - name: Show pod diagnostics on failure
        if: failure()
        run: |
          kubectl -n ${{ env.AKS_NAMESPACE }} get pods -o wide
          kubectl -n ${{ env.AKS_NAMESPACE }} describe pods -l app.kubernetes.io/instance=auth
          echo "── auth logs ──"
          kubectl -n ${{ env.AKS_NAMESPACE }} logs deploy/auth --tail=200 || true
          echo "── auth previous logs (if crash-looping) ──"
          kubectl -n ${{ env.AKS_NAMESPACE }} logs deploy/auth --tail=200 --previous || true
