name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/build-n-deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: samitkumarpatel/multi-tenant-salon-authz

jobs:
  # ── Stage 1: Build & push image ───────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      tag: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          version: '25.1'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build-image
        run: |
          IMAGE=$REGISTRY/$IMAGE_NAME

          ./mvnw -B spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$IMAGE:${{ github.sha }}

          docker push $IMAGE:${{ github.sha }}

          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:latest

          echo "image=$IMAGE:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ── Deploy · Azure Container Apps (ACTIVE) ────────────────────────────────
  # Infra (the salon-saas-mix-auth Container App, its env, PostgreSQL and Key
  # Vault) is provisioned by ../multi-tenant-salon infrastructure/mix. This job
  # only rolls the image. The `api` service ships from the multi-tenant-salon
  # repo's workflow.
  container-apps-deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    permissions:
      contents: read

    env:
      RESOURCE_GROUP: multi-tenant-salon-mix
      AUTH_APP: salon-saas-mix-auth

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Roll auth image on Container Apps
        run: |
          az containerapp update \
            --name "$AUTH_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ needs.build.outputs.image }}"

      - name: Show revision status on failure
        if: failure()
        run: |
          az containerapp revision list \
            --name "$AUTH_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[].{name:name, active:properties.active, state:properties.runningState, replicas:properties.replicas}" \
            -o table || true

  # ── Deploy · AWS ECS / Fargate (DISABLED) ────────────────────────────────
  # Replaced by Container Apps in the Cloudflare + Container Apps migration.
  # To re-enable: re-provision the ECS cluster/service, set the
  # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets, then change `if: false`
  # to `if: true`.
  aws-ecs-deploy:
    runs-on: ubuntu-latest
    if: false
    needs: build
    environment: dev
    permissions:
      contents: read

    env:
      AWS_REGION: eu-north-1
      ECS_SERVICE: my-salon-dev-auth
      ECS_CLUSTER: my-salon-dev-cluster
      ECS_TASK_DEFINITION_FAMILY: my-salon-dev-auth
      CONTAINER_NAME: auth

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@0e613a0980cbf65ed5b322eb7a1e075d28913a83
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_TASK_DEFINITION_FAMILY }} \
            --query 'taskDefinition' \
            --output json \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}
          environment-variables: |
            BPL_JVM_THREAD_COUNT=50

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10

  # ── Deploy · Azure AKS via Helm (DISABLED) ──────────────────────────────
  # The AKS cluster (salon-saas-dev) was retired in the Container Apps
  # migration. To re-enable: re-provision the AKS cluster, then change
  # `if: false` to `if: true`. Chart lives in helm/auth.
  aks-deploy:
    runs-on: ubuntu-latest
    if: false
    needs: build
    environment: dev
    permissions:
      contents: read

    env:
      AKS_RESOURCE_GROUP: multi-tenant-salon-dev
      AKS_CLUSTER_NAME: salon-saas-dev
      AKS_NAMESPACE: salon

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}

      - name: Deploy auth via Helm
        run: |
          helm upgrade --install auth ./helm/auth \
            --namespace ${{ env.AKS_NAMESPACE }} \
            --set image.tag=${{ github.sha }} \
            --wait \
            --timeout 5m \
            --debug

      - name: Show pod diagnostics on failure
        if: failure()
        run: |
          kubectl -n ${{ env.AKS_NAMESPACE }} get pods -o wide
          kubectl -n ${{ env.AKS_NAMESPACE }} describe pods -l app.kubernetes.io/instance=auth
          echo "── auth logs ──"
          kubectl -n ${{ env.AKS_NAMESPACE }} logs deploy/auth --tail=200 || true
          echo "── auth previous logs (if crash-looping) ──"
          kubectl -n ${{ env.AKS_NAMESPACE }} logs deploy/auth --tail=200 --previous || true
