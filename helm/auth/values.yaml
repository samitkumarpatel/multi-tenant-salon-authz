replicaCount: 1

image:
  repository: ghcr.io/samitkumarpatel/multi-tenant-salon-authz
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

fullnameOverride: "auth"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: nginx
  host: auth.salonsaas.org
  tls:
    enabled: true
    # Must match the secretName produced by helm/tools/cert-manager/certificate-prod.yaml
    secretName: salonsaas.org-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

spot:
  enabled: true

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  # api runs in the same namespace (salon), so the ClusterIP Service name resolves directly.
  IDENTITY_SERVICE_URL: "http://api.salon.svc.cluster.local:8080"
  CORS_ALLOWED_ORIGIN_PATTERN: "*"
  # authz database on the same managed Flexible Server api uses (salon-saas-mix-psql) -
  # a second logical database (authz), not a second server. Spring Session JDBC uses it
  # to share HTTP sessions (CSRF token, SecurityContext, the pending /oauth2/authorize
  # request) across replicas - this deployment runs hpa.maxReplicas up to 3.
  SPRING_DATASOURCE_URL: "jdbc:postgresql://salon-saas-mix-psql.postgres.database.azure.com:5432/authz?sslmode=require"
  SPRING_DATASOURCE_USERNAME: "postgres"

# POSTGRES_PASSWORD for the datasource above. azure-postgres-secret → the managed Flexible
# Server (same secret + same admin password api already uses to reach the same server).
database:
  passwordSecretName: azure-postgres-secret

# Sensitive values — override per environment (never commit real values).
# Rendered into a Kubernetes Secret and injected via envFrom. Empty by default:
# MAILJET_API_KEY and MAILJET_API_SECRET come from mailjet-secret (created by
# helm/pre-req-manifest/create-secrets.sh), not from here.
secret: {}
