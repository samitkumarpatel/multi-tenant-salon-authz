replicaCount: 1

image:
  repository: ghcr.io/samitkumarpatel/multi-tenant-salon-authz
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: ghcr-secret

fullnameOverride: "auth"

service:
  type: ClusterIP
  port: 9000

ingress:
  enabled: true
  className: nginx
  host: auth.salonsaas.org
  tls:
    enabled: true
    # Must match the secretName produced by helm/tools/cert-manager/certificate-prod.yaml
    secretName: salonsaas.org-prod

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

spot:
  enabled: true

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

env:
  # api runs in the same namespace (salon), so the ClusterIP Service name resolves directly.
  IDENTITY_SERVICE_URL: "http://api.salon.svc.cluster.local:8080"
  CORS_ALLOWED_ORIGIN_PATTERN: "*"

# Sensitive values — override per environment (never commit real values).
# Rendered into a Kubernetes Secret and injected via envFrom. Empty by default:
# MAILJET_API_KEY and MAILJET_API_SECRET come from mailjet-secret (created by
# helm/pre-req-manifest/create-secrets.sh), not from here.
secret: {}
