server:
  port: 9000

logging:
  level:
    org.springframework.security: info

spring:
  application:
    name: multi-tenant-saloon-authz
  # Global, applies to all groups
  http:
    client:
      service:
        read-timeout: 2s
        group:
          saloon:
            base-url: ${SALON_URL:http://localhost:8080}

  security:
    user:
      name: user
      password: password
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "oidc-client"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://127.0.0.1:8080/login/oauth2/code/oidc-client"
              post-logout-redirect-uris:
                - "http://127.0.0.1:8080/"
              scopes:
                - "openid"
                - "profile"
            require-authorization-consent: true

