<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Please sign in</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .screenreader {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #235533;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            min-height: 44px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            color: #000;
            margin-bottom: 20px;
        }
        input[type="text"]:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 0;
            border-color: transparent;
        }
        button.primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            background-color: #2c5f3a;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button.primary:hover,
        button.primary:focus-visible {
            background-color: #234a2e;
        }
        button.primary:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 2px;
        }
        .error-banner {
            background-color: #f8d7da;
            border: 1px solid #f5c2c7;
            color: #58151c;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .error-banner p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <form id="ott-form" method="post" th:action="@{/ott/generate}">
            <h2>Request a One-Time Token</h2>

            <div class="error-banner" th:if="${param.error != null}">
                <p th:if="${#strings.equals(param.error[0], 'notify')}">Something went wrong on our end. Please try again in a few minutes.</p>
                <p th:unless="${#strings.equals(param.error[0], 'notify')}">We couldn't sign you in. Please check your username and try again.</p>
            </div>

            <label for="ott-username" class="screenreader">Username</label>
            <input type="text" id="ott-username" name="username" placeholder="Username" required autofocus>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="primary" type="submit">Send Token</button>
        </form>
    </div>
</body>
</html>
