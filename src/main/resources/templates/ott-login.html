<!doctype html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title}">Sign in · SalonSaaS</title>
    <style th:replace="~{fragments/ott-theme :: styles}"></style>
</head>
<body>
    <main class="card" aria-labelledby="sign-in-title">
        <div th:replace="~{fragments/ott-theme :: language-selector}"></div>
        <header class="card-header">
            <span th:replace="~{fragments/ott-theme :: lock-icon}"></span>
            <div>
                <h1 id="sign-in-title" th:text="#{login.heading}">Sign in to your salon</h1>
                <p class="subtitle" th:text="#{login.subtitle}">Enter your email to receive a secure sign-in link.</p>
            </div>
        </header>
        <form class="card-body" id="ott-form" method="post" th:action="@{/ott/generate}">
            <div class="error-banner" role="alert" th:if="${param.error != null}">
                <p th:if="${#strings.equals(param.error[0], 'notify')}" th:text="#{login.error.notify}">We are unable to process your request, please try again later.</p>
                <p th:unless="${#strings.equals(param.error[0], 'notify')}" th:text="#{login.error.invalid}">We couldn't sign you in. Please check your email and try again.</p>
            </div>

            <div class="notice-banner" role="status" th:if="${param.error == null and param.logout != null}">
                <p th:text="#{logout.success}">You have been signed out.</p>
            </div>

            <label for="ott-username" th:text="#{login.email}">Email</label>
            <input type="email" id="ott-username" name="username" placeholder="you@example.com" th:placeholder="#{login.email.placeholder}"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Enter a valid email address, such as you@example.com." th:title="#{login.email.validation}"
                   required autofocus>

            <div class="delivery-actions">
                <button class="delivery-btn" type="submit" name="loginType" value="magic-link" disabled th:text="#{login.send.link}">
                    Email me a sign-in link
                </button>

                <button class="delivery-btn secondary" type="submit" name="loginType" value="short-token" disabled th:text="#{login.send.code}">
                    Email me a code instead
                </button>
            </div>

            <input type="hidden" name="lang" th:value="${currentLanguage}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </main>
    <script th:inline="javascript">
        const form = document.getElementById('ott-form');
        const usernameInput = document.getElementById('ott-username');
        const deliveryButtons = document.querySelectorAll('.delivery-btn');
        const buttonLabels = Array.from(deliveryButtons, button => button.textContent.trim());
        let isSubmitting = false;
        const sendingCode = /*[[#{login.sending.code}]]*/ 'Sending code…';
        const sendingLink = /*[[#{login.sending.link}]]*/ 'Sending link…';

        function updateDeliveryButtons() {
            const isValid = usernameInput.validity.valid;
            deliveryButtons.forEach(button => {
                button.disabled = isSubmitting || !isValid;
            });
        }

        form.addEventListener('submit', event => {
            if (isSubmitting) {
                event.preventDefault();
                return;
            }

            const submitter = event.submitter || deliveryButtons[0];
            // Disabled buttons are excluded from form data, so preserve the selected delivery method.
            const deliveryMethod = document.createElement('input');
            deliveryMethod.type = 'hidden';
            deliveryMethod.name = 'loginType';
            deliveryMethod.value = submitter.value;
            form.appendChild(deliveryMethod);

            isSubmitting = true;
            form.setAttribute('aria-busy', 'true');
            submitter.textContent = submitter.value === 'short-token' ? sendingCode : sendingLink;
            updateDeliveryButtons();
        });

        usernameInput.addEventListener('input', updateDeliveryButtons);
        usernameInput.addEventListener('change', updateDeliveryButtons);
        window.addEventListener('pageshow', () => {
            isSubmitting = false;
            form.removeAttribute('aria-busy');
            form.querySelectorAll('input[name="loginType"]').forEach(input => input.remove());
            deliveryButtons.forEach((button, index) => {
                button.textContent = buttonLabels[index];
            });
            updateDeliveryButtons();
        });
        updateDeliveryButtons();
    </script>
</body>
</html>
