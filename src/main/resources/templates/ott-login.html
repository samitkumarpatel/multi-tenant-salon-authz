<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; SalonSaaS</title>
    <style th:replace="~{fragments/ott-theme :: styles}"></style>
</head>
<body>
    <main class="card" aria-labelledby="sign-in-title">
        <header class="card-header">
            <span th:replace="~{fragments/ott-theme :: lock-icon}"></span>
            <div>
                <h1 id="sign-in-title">Sign in to your salon</h1>
                <p class="subtitle">Enter your email to receive a sign-in link or code.</p>
            </div>
        </header>
        <form class="card-body" id="ott-form" method="post" th:action="@{/ott/generate}">
            <div class="error-banner" role="alert" th:if="${param.error != null}">
                <p th:if="${#strings.equals(param.error[0], 'notify')}">We are unable to process your request, please try again later.</p>
                <p th:unless="${#strings.equals(param.error[0], 'notify')}">We couldn't sign you in. Please check your email and try again.</p>
            </div>

            <div class="notice-banner" role="status" th:if="${param.error == null and param.logout != null}">
                <p>You have been signed out.</p>
            </div>

            <label for="ott-username">Email</label>
            <input type="email" id="ott-username" name="username" placeholder="you@example.com"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   pattern="[^@\s]+@[^@\s]+\.[^@\s]+" title="Enter a valid email address, such as you@example.com."
                   required autofocus>

            <div class="delivery-actions">
                <button class="delivery-btn" type="submit" name="loginType" value="magic-link" disabled>
                    Send a magic link
                </button>

                <button class="delivery-btn" type="submit" name="loginType" value="short-token" disabled>
                    Send a code
                </button>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </main>
    <script>
        const usernameInput = document.getElementById('ott-username');
        const deliveryButtons = document.querySelectorAll('.delivery-btn');

        function updateDeliveryButtons() {
            const isValid = usernameInput.validity.valid;
            deliveryButtons.forEach(button => {
                button.disabled = !isValid;
            });
        }

        usernameInput.addEventListener('input', updateDeliveryButtons);
        usernameInput.addEventListener('change', updateDeliveryButtons);
        window.addEventListener('pageshow', updateDeliveryButtons);
        updateDeliveryButtons();
    </script>
</body>
</html>
