<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; SalonSaaS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 16px;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            border-radius: 8px;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 24px;
        }
        .screenreader {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #235533;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            min-height: 44px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            color: #000;
            margin-bottom: 24px;
        }
        input[type="text"]:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 0;
            border-color: transparent;
        }

        .send-label {
            font-weight: 600;
            color: #235533;
            margin-bottom: 8px;
        }
        .delivery-actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .delivery-btn {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            min-height: 64px;
            padding: 12px 14px;
            font-size: 14px;
            background-color: #2c5f3a;
            color: #fff;
            border: 2px solid #2c5f3a;
            border-radius: 6px;
            cursor: pointer;
        }
        .delivery-btn .icon {
            font-size: 1.3rem;
        }
        .delivery-btn .text {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .delivery-btn .title {
            font-weight: 700;
            color: #fff;
        }
        .delivery-btn .desc {
            font-size: 12px;
            color: #d9e8dd;
        }
        .delivery-btn:hover,
        .delivery-btn:focus-visible {
            background-color: #234a2e;
            border-color: #234a2e;
        }
        .delivery-btn:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 2px;
        }
        .error-banner {
            background-color: #f8d7da;
            border: 1px solid #f5c2c7;
            color: #58151c;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .error-banner p {
            margin: 0;
        }
        .notice-banner {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #235533;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .notice-banner p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="card">
        <form id="ott-form" method="post" th:action="@{/ott/generate}">
            <h2>Sign in</h2>

            <div class="error-banner" th:if="${param.error != null}">
                <p th:if="${#strings.equals(param.error[0], 'notify')}">We are unable to process your request, please try again later.</p>
                <p th:unless="${#strings.equals(param.error[0], 'notify')}">We couldn't sign you in. Please check your email and try again.</p>
            </div>

            <div class="notice-banner" th:if="${param.error == null and param.logout != null}">
                <p>You have been signed out.</p>
            </div>

            <label for="ott-username">Email</label>
            <input type="text" id="ott-username" name="username" placeholder="you@example.com" autocomplete="username" required autofocus>

            <p class="send-label">How should we send it?</p>
            <div class="delivery-actions">
                <button class="delivery-btn" type="submit" name="loginType" value="magic-link">
                    <span class="icon" aria-hidden="true">&#128279;</span>
                    <span class="text">
                        <span class="title">Send a magic link</span>
                        <span class="desc">One click to sign in</span>
                    </span>
                </button>

                <button class="delivery-btn" type="submit" name="loginType" value="short-token">
                    <span class="icon" aria-hidden="true">&#128290;</span>
                    <span class="text">
                        <span class="title">Send the code</span>
                        <span class="desc">Type it in yourself</span>
                    </span>
                </button>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        </form>
    </div>
</body>
</html>
