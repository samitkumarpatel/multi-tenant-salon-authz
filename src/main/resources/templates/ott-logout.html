<!doctype html>
<html lang="en" th:lang="${#locale.toLanguageTag()}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title th:text="#{logout.title}">SalonSaaS</title>
    <style th:replace="~{fragments/ott-theme :: styles}"></style>
</head>
<body>
<main class="card" aria-labelledby="page-title">
    <div th:replace="~{fragments/ott-theme :: language-selector}"></div>

    <header class="card-header">
        <span th:replace="~{fragments/ott-theme :: lock-icon}"></span>
        <div><h1 id="page-title" th:text="#{logout.heading}">Sign out?</h1><p class="subtitle" th:text="#{logout.subtitle}">Confirm that you want to sign out.</p></div>
    </header>
    <form class="card-body" method="post" th:action="@{/logout}">
        <input type="hidden" name="lang" th:value="${currentLanguage}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="primary" type="submit" th:text="#{logout.submit}">Sign out</button>
        <a class="back-link" th:href="@{/ott/login(lang=${currentLanguage})}" th:text="#{login.back}">Back to sign in</a>
    </form>
</main>
</body>
</html>
