<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One-Time Token Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .screenreader {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #235533;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            min-height: 44px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            color: #000;
            margin-bottom: 20px;
        }
        input[type="text"]:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 0;
            border-color: transparent;
        }
        button.primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            background-color: #2c5f3a;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button.primary:hover,
        button.primary:focus-visible {
            background-color: #234a2e;
        }
        button.primary:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="card">
        <form id="ott-login-form" method="post" th:action="@{/login/ott}">
            <h2>Please input the token</h2>

            <label for="ott-token" class="screenreader">Token</label>
            <input type="text" id="ott-token" name="token" th:value="${token}" placeholder="Token" required autofocus>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="primary" type="submit">Sign in</button>
        </form>
    </div>
</body>
</html>
