<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in &middot; SalonSaaS</title>
    <style th:replace="~{fragments/ott-theme :: styles}"></style>
</head>
<body>
    <main class="card" aria-labelledby="sign-in-title">
        <header class="card-header">
            <span th:replace="~{fragments/ott-theme :: lock-icon}"></span>
            <div>
                <h1 id="sign-in-title" th:text="${fromMagicLink} ? 'Sign in to your salon' : 'Enter your code'">Enter your code</h1>
                <p class="subtitle" th:if="${fromMagicLink}">Your magic link is ready. Click below to finish signing in.</p>
                <p class="subtitle" th:unless="${fromMagicLink}">If an account exists for this email, you'll receive a 6-digit code shortly. Enter it below.</p>
            </div>
        </header>
        <form class="card-body" id="ott-login-form" method="post" th:action="@{/login/ott}">
            <input th:if="${fromMagicLink}" type="hidden" name="token" th:value="${token}">
            <div th:unless="${fromMagicLink}">
                <label for="ott-token">Code</label>
                <input type="text" id="ott-token" name="token" th:value="${token}" placeholder="000000"
                       inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code"
                       required autofocus>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <button class="primary" type="submit">Sign in</button>
            <a class="back-link" href="/ott/login" th:href="@{/ott/login}">&larr; Back to sign in</a>
        </form>
    </main>
</body>
</html>
