<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SalonSaaS sign-in theme</title>
    <style th:fragment="styles">
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            color: #172b46;
            background-color: #f7f9fb;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 56px 16px;
        }
        .card {
            background: #fff;
            width: 100%;
            max-width: 360px;
            border: 1px solid #dce4ed;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgb(23 43 70 / 12%);
        }
        .language-bar { padding: 12px 24px 0; }
        .language-form { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
        .language-form label { margin: 0; font-size: 12px; color: #64748b; }
        .language-form select { min-height: 40px; max-width: 100%; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; color: #172b46; font: inherit; cursor: pointer; }
        .language-form select:focus-visible { outline: 2px solid #567330; outline-offset: 2px; }
        .language-form button { padding: 8px; font: inherit; cursor: pointer; }
        .scope-option { display: flex; align-items: flex-start; gap: 10px; margin: 12px 0; line-height: 1.6; }
        .scope-option input { margin-top: 4px; }
        .scope-option label { font-weight: 400; margin: 0; overflow-wrap: anywhere; }
        .secondary-form { margin-top: 10px; }
        .support-text { margin-top: 16px; color: #64748b; font-size: 12px; line-height: 1.6; }
        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 20px 24px;
            border-bottom: 1px solid #edf1f5;
        }
        .lock-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 28px;
            height: 28px;
            border-radius: 50%;
            background: #e3ebd3;
            color: #567330;
        }
        h1 {
            font-size: 14px;
            font-weight: 600;
            line-height: 28px;
        }
        .subtitle {
            margin-top: 4px;
            font-size: 13px;
            line-height: 1.6;
            color: #64748b;
        }
        .card-body {
            padding: 20px 24px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 13px;
            color: #334155;
        }
        input:is([type="text"], [type="email"]) {
            width: 100%;
            padding: 10px 12px;
            min-height: 44px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            font-size: 16px;
            color: #172b46;
            background: #fff;
            margin-bottom: 16px;
        }
        input:is([type="text"], [type="email"]):focus-visible {
            outline: 2px solid #567330;
            outline-offset: 2px;
        }

        .delivery-actions {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        :is(.delivery-btn, .primary) {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 40px;
            padding: 10px 14px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            background-color: #567330;
            color: #fff;
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
        }
        :is(.delivery-btn, .primary):enabled:hover {
            background-color: #465e27;
        }
        .delivery-btn.secondary {
            background-color: #fff;
            color: #567330;
            border-color: #567330;
        }
        .delivery-btn.secondary:enabled:hover {
            background-color: #f0f4e9;
        }
        :is(.delivery-btn, .primary):focus-visible {
            outline: 2px solid #567330;
            outline-offset: 2px;
        }
        :is(.delivery-btn, .primary):disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .error-banner {
            background-color: #f8d7da;
            border: 1px solid #f5c2c7;
            color: #58151c;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .error-banner p {
            margin: 0;
        }
        .notice-banner {
            background-color: #f0f4e9;
            border: 1px solid #dce6cb;
            color: #465e27;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 16px;
        }
        .notice-banner p {
            margin: 0;
        }
        .back-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #567330;
            font-size: 13px;
            line-height: 1.6;
            text-decoration: none;
        }
        .back-link:hover,
        .back-link:focus-visible {
            text-decoration: underline;
        }
        .back-link:focus-visible {
            outline: 2px solid #567330;
            outline-offset: 2px;
            border-radius: 4px;
        }
        .card-body > .back-link:only-child {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div th:fragment="language-selector" class="language-bar">
        <form class="language-form" method="get" th:action="${languagePath}">
            <input th:each="parameter : ${languageParameters}" type="hidden" th:name="${parameter.name}" th:value="${parameter.value}">
            <label for="auth-language" th:text="#{language.label}">Language</label>
            <select id="auth-language" name="lang" onchange="this.form.requestSubmit()">
                <option th:each="language : ${supportedLanguages}" th:value="${language.code}" th:selected="${language.code == currentLanguage}" th:text="${language.name}">English</option>
            </select>
            <noscript><button type="submit" th:text="#{language.apply}">Apply</button></noscript>
        </form>
    </div>
            <span th:fragment="lock-icon" class="lock-icon" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                    <rect x="4" y="10" width="16" height="11" rx="2"/>
                    <path d="M8 10V6a4 4 0 0 1 8 0v4"/>
                </svg>
            </span>
</body>
</html>
