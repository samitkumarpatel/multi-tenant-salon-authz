<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check your email &middot; SalonSaaS</title>
    <style th:replace="~{fragments/ott-theme :: styles}"></style>
</head>
<body>
    <main class="card" aria-labelledby="sign-in-title">
        <header class="card-header">
            <span th:replace="~{fragments/ott-theme :: lock-icon}"></span>
            <div>
                <h1 id="sign-in-title">Check your email</h1>
                <p class="subtitle">If an account exists for this email, you'll receive a sign-in link shortly.</p>
            </div>
        </header>
        <div class="card-body">
            <a class="back-link" href="/ott/login" th:href="@{/ott/login}">&larr; Back to sign in</a>
        </div>
    </main>
</body>
</html>
