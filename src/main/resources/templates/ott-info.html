<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One-Time Token Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
            border-radius: 8px;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .info-banner {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #235533;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
        }
        .info-banner p {
            margin: 0;
        }
        .info-banner .ott-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            padding: 10px 14px;
            min-height: 44px;
            background-color: #2c5f3a;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
        }
        .info-banner .ott-link:hover,
        .info-banner .ott-link:focus-visible {
            background-color: #234a2e;
            text-decoration: underline;
        }
        .info-banner .ott-link:focus-visible {
            outline: 2px solid #235533;
            outline-offset: 2px;
        }
        .info-banner .ott-divider {
            margin-top: 12px;
            font-weight: 600;
        }
        .back-link {
            display: block;
            margin-top: 16px;
            text-align: center;
            color: #2c5f3a;
            font-size: 13px;
            text-decoration: none;
        }
        .back-link:hover,
        .back-link:focus-visible {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Check your email</h2>
        <div class="info-banner">
            <p>We emailed you a magic sign-in link &mdash; click it to finish signing in.</p>
            <p class="ott-divider">If it doesn't work in this browser, the email also has a
               code you can enter manually.</p>
            <a class="ott-link" href="/ott/input">Enter your code instead &rarr;</a>
        </div>
        <a class="back-link" href="/ott/login">&larr; Back to sign in</a>
    </div>
</body>
</html>
