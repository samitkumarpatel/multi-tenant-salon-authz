<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>One-Time Token Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            background-color: #e8e8e8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }
        .card {
            background: #fff;
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #000;
            line-height: 1.2;
            margin-bottom: 20px;
        }
        .info-banner {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #3d7a4e;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 0;
        }
        .info-banner a {
            color: #2c5f3a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>One-Time Token Sent</h2>
        <div class="info-banner">
            A login link has been sent to your email. Please use that for login or
            <a href="/login/ott">click here</a> and fill the one time token.
        </div>
    </div>
</body>
</html>
